[package]
name = "deck_macro_editor"
version = "0.1.0"
description = "Desktop editor for Waveshare macro deck"
authors = ["Finlay"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4.5"
tauri = { version = "1.6", features = ["dialog-open", "system-tray"] }
tauri-plugin-autostart = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
